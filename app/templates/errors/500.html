{% extends "base.html" %}
{% block title %}Server Error — 500{% endblock %}
{% block content %}
<div class="card" style="max-width: 650px; margin: 3rem auto; text-align: center; padding: 3rem 2rem;">
  <div style="font-size: 3.5rem; margin-bottom: 1rem;">⚙️</div>
  <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--danger); margin-bottom: 0.5rem;">500 Internal Error</h1>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
    A database or server exception occurred during processing. Raw details have been contained safely.
  </p>
  {% if error %}
  <div style="background-color: var(--bg-subtle); padding: 1rem; border-radius: var(--radius-md); font-family: var(--font-mono); font-size: 0.8rem; text-align: left; margin-bottom: 1.5rem; overflow-x: auto;">
    {{ error }}
  </div>
  {% endif %}
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
