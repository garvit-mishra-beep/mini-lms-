{% extends "base.html" %}
{% block title %}Add New Student — MiniLMS{% endblock %}
{% block header_title %}Add Student{% endblock %}

{% block content %}
<div style="max-width: 650px; margin: 1rem auto;">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Add New Student Profile</h2>
      <a href="{{ url_for('students.index') }}" class="btn btn-secondary btn-sm">Cancel</a>
    </div>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
        <label class="form-label" for="full_name">Full Name *</label>
        <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Rahul Sharma" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address *</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="rahul@example.test" required>
        <div class="form-help">Must be a unique valid email address.</div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="roll_no">Roll Number *</label>
          <input type="text" id="roll_no" name="roll_no" class="form-control" placeholder="e.g. 23BCE1099" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="enrollment_no">Enrollment Number *</label>
          <input type="text" id="enrollment_no" name="enrollment_no" class="form-control" placeholder="e.g. EN20230099" required>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="text" id="phone" name="phone" class="form-control" placeholder="e.g. +91 9876543210">
        </div>

        <div class="form-group">
          <label class="form-label" for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob" class="form-control">
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
        <a href="{{ url_for('students.index') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Create Student</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
