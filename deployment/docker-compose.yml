version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: minilms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-minilms_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    command: --default-authentication-plugin=mysql_native_password --sql-mode="STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: minilms_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-minilms_db}
      SECRET_KEY: ${SECRET_KEY:-production-secret-key-change-me}
      PORT: 5000
    ports:
      - "5000:5000"

volumes:
  mysql_data:
